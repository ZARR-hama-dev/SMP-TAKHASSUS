<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>
<style>
body{
    background:#081323;
    color:#fff;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    padding:20px;
}
.container{
    max-width:420px;
    width:100%;
}
video{
    width:100%;
    border-radius:15px;
    margin-bottom:15px;
}
select,button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
}
button{
    background:#3b82f6;
    color:#fff;
    cursor:pointer;
}
</style>
</head>
<body>

<div class="container">

<video id="player" controls autoplay muted playsinline>
<source src="https://files.catbox.moe/kjo574.mp4" type="video/mp4">
</video>

<select id="videoSelect">
<option value="https://files.catbox.moe/kjo574.mp4">Video 1</option>
<option value="https://files.catbox.moe/cbd4nf.mp4">Video 2</option>
<option value="https://files.catbox.moe/i34z2g.mp4">Video 3</option>
<option value="https://files.catbox.moe/wodes6.mp4">Video 4</option>
</select>

<button onclick="putarVideo()">Putar Video</button>

</div>

<script>
function putarVideo(){
    const player=document.getElementById("player");
    const url=document.getElementById("videoSelect").value;

    player.src=url;
    player.load();
    player.play();
}

document.getElementById("videoSelect").addEventListener("change", putarVideo);
</script>

</body>
</html>
