<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMP TAKHASSUS</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(180deg,#050505,#0b1735,#2b0606);
color:#fff;
padding:20px;
padding-bottom:90px;
}

.container{
max-width:420px;
margin:auto;
}

.profile{
display:flex;
align-items:center;
background:#121212;
border:1px solid #2f7cff;
border-radius:20px;
padding:15px;
box-shadow:0 0 20px rgba(47,124,255,.2);
margin-bottom:20px;
}

.profile img{
width:70px;
height:70px;
border-radius:50%;
margin-right:15px;
border:3px solid #ff3030;
object-fit:cover;
}

.profile h2{
font-size:22px;
margin-bottom:5px;
}

.profile p{
font-size:14px;
color:#c9d5ff;
}

.banner video{
width:100%;
height:220px;
object-fit:cover;
border-radius:20px;
background:#000;
border:2px solid #2f7cff;
margin-bottom:20px;
}

.panel{
background:#121212;
border-radius:20px;
padding:20px;
border:1px solid #ff3030;
box-shadow:0 0 20px rgba(255,48,48,.2);
}

.panel h2{
margin-bottom:15px;
}

.panel label{
display:block;
margin-bottom:10px;
}

select{
width:100%;
padding:14px;
border-radius:12px;
border:none;
background:#1b1b1b;
color:#fff;
margin-bottom:15px;
font-size:16px;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#ff2d2d,#2f7cff);
color:#fff;
font-size:17px;
cursor:pointer;
font-weight:bold;
}

button:hover{
opacity:.9;
}

.bottom{
position:fixed;
left:0;
right:0;
bottom:0;
display:flex;
justify-content:space-around;
background:#111;
padding:12px 0;
border-top:2px solid #2f7cff;
}

.bottom a{
text-decoration:none;
color:#fff;
font-size:13px;
text-align:center;
}

.bottom i{
display:block;
font-size:22px;
margin-bottom:4px;
}
</style>
</head>

<body>

<div class="container">

<div class="profile">
<img src="https://files.catbox.moe/9h0poh.jpg">
<div>
<h2>TAK DIKENAL</h2>
<p>STATUS : FREE </p>
<p>DI BUAT OLEH : MAS MAS</p>
</div>
</div>

<div class="banner">
<video id="banner" controls autoplay muted playsinline>
<source src="https://files.catbox.moe/kjo574.mp4" type="video/mp4">
</video>
</div>

<div class="panel">

<h2>📹 Video SMP TAKHASSUS</h2>

<label>SMP TAKHASSUS Video</label>

<select id="videoSelect">
<option value="https://files.catbox.moe/kjo574.mp4">Video 1</option>
<option value="https://files.catbox.moe/cbd4nf.mp4">Video 2</option>
<option value="https://files.catbox.moe/i34z2g.mp4">Video 3</option>
<option value="https://files.catbox.moe/wodes6.mp4">Video 4</option>
<option value="https://files.catbox.moe/9wuvgo.mp4">Video 5</option>
<option value="https://files.catbox.moe/5yy1ks.mp4">Video 6</option>
<option value="https://files.catbox.moe/u28xgu.mp4">Video 7</option>
<option value="https://files.catbox.moe/1ho0jz.mp4">Video 8</option>
</select>

<button onclick="gantiVideo()">SMP TAKHASSUS VIDEO</button>
</div>

</div>

<div class="bottom">

<a href="#">
<i class="fa-solid fa-house"></i>
Home
</a>

<a href="#">
<i class="fa-solid fa-film"></i>
Video
</a>

<a href="#">
<i class="fa-solid fa-screwdriver-wrench"></i>
Tools
</a>

<a href="#">
<i class="fa-solid fa-user"></i>
Profile
</a>

</div>

<script>

function gantiVideo(){

const player=document.getElementById("banner");
const url=document.getElementById("videoSelect").value;

player.src=url;
player.load();

player.play().catch(()=>{});

}

document.getElementById("videoSelect").addEventListener("change",gantiVideo);

</script>

</body>
</html>
