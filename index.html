<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(180deg,#050505,#09152c,#330909);
color:#fff;
padding:20px;
padding-bottom:90px;
}

.container{
max-width:430px;
margin:auto;
}

.profile{
display:flex;
align-items:center;
background:#10131d;
padding:15px;
border-radius:20px;
border:1px solid #2f7cff;
box-shadow:0 0 15px rgba(47,124,255,.25);
margin-bottom:18px;
}

.profile img{
width:70px;
height:70px;
border-radius:50%;
margin-right:15px;
border:2px solid #ff2f2f;
object-fit:cover;
}

.profile h2{
font-size:21px;
margin-bottom:5px;
}

.profile p{
font-size:14px;
color:#b8cbff;
}

.banner img,
.banner video{
width:100%;
height:210px;
border-radius:20px;
object-fit:cover;
border:2px solid #2f7cff;
background:#000;
margin-bottom:20px;
}

#banner{
display:none;
}

.panel{
background:#10131d;
padding:20px;
border-radius:20px;
border:1px solid #ff2f2f;
box-shadow:0 0 15px rgba(255,47,47,.25);
}

.panel h2{
margin-bottom:15px;
}

select{
width:100%;
padding:13px;
background:#1d1d1d;
color:#fff;
border:none;
border-radius:12px;
margin-top:10px;
margin-bottom:15px;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#ff2f2f,#2f7cff);
color:#fff;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.menu-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
margin-top:20px;
}

.menu-card{
background:#181818;
border:1px solid #2f7cff;
border-radius:15px;
padding:18px;
text-align:center;
transition:.3s;
}

.menu-card:hover{
transform:scale(1.05);
border-color:#ff2f2f;
}

.menu-card i{
display:block;
font-size:28px;
margin-bottom:10px;
color:#2f7cff;
}

.menu-card span{
font-size:14px;
}

.bottom{
position:fixed;
left:0;
right:0;
bottom:0;
display:flex;
justify-content:space-around;
background:#111;
padding:12px 0;
border-top:2px solid #2f7cff;
}

.bottom a{
color:#fff;
text-decoration:none;
font-size:13px;
text-align:center;
}

.bottom i{
display:block;
font-size:22px;
margin-bottom:5px;
}

const player = document.getElementById("banner");
